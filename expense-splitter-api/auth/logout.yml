info:
  name: /auth/logout
  type: http
  seq: 5

http:
  method: post
  url: "{{base_url}}/auth/logout"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refresh_token}}"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
