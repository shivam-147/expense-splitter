info:
  name: /api/v1/auth/resend-otp
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/resend-otp"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
