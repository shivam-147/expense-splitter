info:
  name: /auth/verify-otp
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/verify-otp"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "otp": "482843"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
