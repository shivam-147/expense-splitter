info:
  name: /auth/register
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "shivam test",
        "email": "{{email}}",
        "password": "{{pass}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
